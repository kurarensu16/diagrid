version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Manila
    open-pull-requests-limit: 5
    groups:
      production-security-and-maintenance:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-security-and-maintenance:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Manila
    groups:
      actions-maintenance:
        patterns:
          - "*"
